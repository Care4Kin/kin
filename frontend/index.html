<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kin is a shared dashboard for older adults and their families to manage bills, prescriptions, and appointments together — safely and independently." />
    <title>Kin</title>
    <script>
      (function () {
        var VALID_THEMES = ['white-emerald', 'sage-cream', 'soft-blue-slate', 'sunset-coral', 'lavender-charcoal', 'navy-gold']
        var theme = localStorage.getItem('theme')
        if (VALID_THEMES.indexOf(theme) === -1) theme = 'sage-cream'
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
